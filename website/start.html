<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智学职达</title>
  <meta name="robots" content="noindex" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #F5F5F7;
      font-family: "SimSun", "宋体", "Songti SC", serif;
      display: flex; align-items: center; justify-content: center;
    }
    /* 居中格言 */
    .quote {
      max-width: min(640px, 84vw);
      text-align: center;
      transform: translateY(-4vh);
    }
    .quote .text {
      font-size: clamp(18px, 3.2vw, 26px);
      line-height: 2;
      color: #000;
      letter-spacing: .08em;
    }
    .quote .author {
      margin-top: 18px;
      text-align: right;
      font-size: clamp(14px, 2vw, 17px);
      color: #000;
      letter-spacing: .12em;
    }
    /* 靠下位置的入口 */
    .start {
      position: absolute;
      left: 0; right: 0;
      bottom: 16%;
      text-align: center;
      font-size: clamp(20px, 3.4vw, 28px);
      letter-spacing: .6em;
      text-indent: .6em;
      color: #000;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
    }
    /* 底部：备案号与举报邮箱 */
    .legal {
      position: absolute;
      left: 0; right: 0;
      bottom: 18px;
      text-align: center;
      font-size: 12px;
      letter-spacing: .05em;
      color: rgba(0, 0, 0, .35);
    }
    .legal a { color: rgba(0, 0, 0, .35); text-decoration: none; margin: 0 6px; transition: color .2s; }
    .legal a:hover { color: rgba(0, 0, 0, .65); }
  </style>
</head>
<body>
  <div class="quote">
    <div class="text">“职业无贵贱之分，<br>苟有益于人群，皆是无上上品。”</div>
    <div class="author">—— 黄炎培</div>
  </div>
  <a class="start" href="index.html">开 始</a>

  <footer class="legal">
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">桂ICP备2026021376号</a>
    <span>举报邮箱：<a href="mailto:j2647046805@163.com">j2647046805@163.com</a></span>
  </footer>
</body>
</html>
