# ============================================
# 站点1: 项目官网（纯静态, http://zhzdai.xyz）
# HTTPS 自动启用：把证书放到部署目录的 ssl/（fullchain.pem + key.pem），
# 重启 nginx 容器即自动开启 443 并让 80 端口 301 跳转 HTTPS；
# 证书缺失时保持纯 HTTP，不会导致容器启动失败（逻辑见 nginx/40-https.sh）
# ============================================
server {
    listen 80;
    server_name zhzdai.xyz www.zhzdai.xyz 8.163.105.116;

    # 由容器启动脚本生成：有证书时内容为 return 301 https://...，无证书时为空
    include /etc/nginx/conf.d/ssl-redirect.inc;

    root /usr/share/nginx/website;
    index start.html index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # App 安装包下载：不做 SPA 回退，直接用安卓安装包 MIME 类型返回
    location /apk/ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;
}

# ============================================
# 站点2: 管理端后台（React SPA, http://服务器IP:8081）
# ============================================
server {
    listen 8081;
    server_name zhixuezhida.top www.zhixuezhida.top _;

    # 前端静态文件（React SPA，由 Dockerfile.frontend 构建产出）
    root /usr/share/nginx/html;
    index index.html;

    # 入口 HTML 不缓存：避免升级后浏览器仍加载旧 index.html（引用旧 hash 的 JS/CSS）
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # 前端页面（SPA 路由回退）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Docker 内部 DNS：允许 backend 容器不存在时 nginx 仍可启动（请求时才解析）
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 后端 API 反向代理（变量写法延迟解析，避免启动时因 backend 不存在而崩溃）
    set $backend_upstream http://backend:8080;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # 上传文件静态资源
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # WebSocket 代理 (聊天功能)
    location /ws/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;
}
