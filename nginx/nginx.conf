# ============================================
# 站点1: 项目官网（纯静态, http://zhixuezhida.top）
# 备案完成后可启用下方 HTTPS server 块
# ============================================
server {
    listen 80;
    server_name zhixuezhida.top www.zhixuezhida.top 8.138.171.50;

    root /usr/share/nginx/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;
}

