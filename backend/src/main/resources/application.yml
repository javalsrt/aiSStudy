server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: znxsgl-backend
  # 关闭 Spring Boot 启动横幅，控制台只保留关键信息
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:mysql://localhost:3306/znxsglTest?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    # 关闭 MyBatis-Plus 启动 ASCII 横幅
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-not-delete-value: 0
  # 审计字段自动填充（配合实体 @TableField(fill=...) 使用）
  meta-object-handler: com.znxsgl.config.MyBatisPlusMetaObjectHandler

jwt:
  # 通过环境变量 JWT_SECRET 注入，本地开发默认值仅供测试使用
  secret: ${JWT_SECRET:ZnxsglRAGLearningApp2026SecretKeyForJWTTokenGenerationMustBe256Bits}
  expiration: 604800000

# LLM 对话模型配置（当前使用 DeepSeek V4.1 Flash）
# API Key 必须通过环境变量 DEEPSEEK_API_KEY 注入，不再内置兜底值
llm:
  api-key: ${DEEPSEEK_API_KEY}
  model: deepseek-flash
  url: https://api.deepseek.com/chat/completions

# 作息表图片识别（OpenAI 兼容的多模态视觉模型）
# 默认硅基流动 Qwen2.5-VL；也可换成智谱 GLM-4V / 通义 qwen-vl 等兼容接口
vision:
  api-key: ${VISION_API_KEY:}
  url: ${VISION_URL:https://api.siliconflow.cn/v1/chat/completions}
  model: ${VISION_MODEL:Qwen/Qwen2.5-VL-7B-Instruct}

# 本地作息表 OCR 服务（RapidOCR + 版式解析，离线零成本，优先于视觉模型）
ocr:
  url: ${OCR_SERVICE_URL:http://localhost:8100}
  # 是否随 Spring Boot 自动启动本地 OCR 进程（需本机安装 ocr-service/requirements.txt 依赖）
  auto-start: ${OCR_AUTO_START:true}
  port: ${OCR_PORT:8100}
  # Python 命令：Windows 一般 python，Linux/macOS 可能为 python3
  python-cmd: ${OCR_PYTHON:python}
  # 服务目录，留空自动探测（项目根/backend 上级目录下的 ocr-service）
  work-dir:

# 本地 BGE-M3 Embedding 服务配置，宽带是数据流量大小，吞吐是发送接收的效率，物理层，传输层，数据链路层，网络层，会话层，应用层
embedding:
  local:
    url: http://localhost:8000/embeddings
    # 是否随 Spring Boot 一起启动本地 Embedding 服务
    auto-start: true
    port: 8000
    # Python 命令，Windows 可改为 python，Linux/macOS 可改为 python3
    python-cmd: python
    # 服务目录，留空则自动探测（项目根目录/embedding-service 或 backend/../embedding-service）
    work-dir:

# 本地前端：官网静态站点 + React 管理端随 Spring Boot 一起启停
# 容器部署时由 FRONTEND_LOCAL_AUTO_START=false 关闭（前端由 Nginx 托管）
frontend:
  local:
    auto-start: ${FRONTEND_LOCAL_AUTO_START:true}
    # 项目官网（website/ 静态站点，Python http.server）
    website:
      enabled: true
      port: ${WEBSITE_PORT:5500}
      python-cmd: ${WEBSITE_PYTHON:python}
      work-dir:
    # React 管理端（web-admin-react，Vite 开发服务器）
    admin:
      enabled: true
      port: ${ADMIN_DEV_PORT:5174}
      npm-cmd: ${ADMIN_NPM:npm}
      work-dir:

app:
  redis:
    # 是否启用 Redis 分布式幂等/限流；本地无 Redis 时保持 false
    enabled: ${APP_REDIS_ENABLED:false}
  question-bank:
    # 是否启用题库定时预生成（默认关闭，避免夜间大量调用大模型）
    prewarm-enabled: ${QUESTION_BANK_PREWARM_ENABLED:false}
    prewarm-cron: ${QUESTION_BANK_PREWARM_CRON:0 0 4 * * ?}

# 生产监控与健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: znxsgl-backend
  # 本地未启用 Redis（app.redis.enabled=false）时关闭 Redis 健康检查，
  # 避免本地开发日志持续刷 "Redis health check failed"；服务器通过 APP_REDIS_ENABLED=true 打开
  health:
    redis:
      enabled: ${APP_REDIS_ENABLED:false}

# 日志简化：仅在 WARN/ERROR 时输出框架日志，正常启动由应用自己打印一行摘要
logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{0} - %msg%n"
  level:
    root: WARN
    # Spring Security 未配置 UserDetailsService 时会打印随机密码警告，本项目使用 JWT，无需该提示
    org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration: ERROR