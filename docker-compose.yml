services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: znxsgl-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: znxsglTest
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    command: --innodb-buffer-pool-size=128M
    ports:
      - "3307:3306"   # 映射到宿主机 3307 避免和本地 MySQL 冲突
    volumes:
      - mysql_data:/var/lib/mysql           # 数据持久化
      - ./init-db:/docker-entrypoint-initdb.d  # 自动初始化 SQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Spring Boot 后端 =====
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: znxsgl-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/znxsglTest?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      JWT_SECRET: ZnxsglRAGLearningApp2026SecretKeyForJWTTokenGenerationMustBe256Bits
      JWT_EXPIRATION: "86400000"
      # LLM 对话模型（DeepSeek），Key 需在服务器上通过 .env 提供
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 容器内无 Python，禁止后端自启 Embedding 进程，改用独立容器
      EMBEDDING_LOCAL_AUTO_START: "false"
      EMBEDDING_LOCAL_URL: http://embedding:8000/embeddings
    ports:
      - "8080:8080"

  # ===== Nginx 前端（React SPA，构建于 Dockerfile.frontend）=====
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: znxsgl-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"       # 访问 http://服务器IP 即可打开
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ===== 本地 Embedding 服务（RAG/AI 问答用，可选）=====
  # 启动：docker compose --profile ai up -d
  # 首次启动自动下载 BGE-M3 模型约 2.2GB，建议服务器内存 >= 4GB
  embedding:
    profiles: ["ai"]
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: znxsgl-embedding
    restart: unless-stopped
    environment:
      EMBEDDING_DEVICE: cpu
    ports:
      - "8000:8000"
    volumes:
      - embedding_models:/app/models   # 模型缓存持久化，重启不用重新下载

volumes:
  mysql_data:
  embedding_models:
